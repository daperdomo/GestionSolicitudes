name: sb-solicitudes

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?Defina SQL_SERVER_PASSWORD en .env.docker}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/backend/SB.Solicitudes.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=SbSolicitudes;User Id=sa;Password=${SQL_SERVER_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Issuer: SB.Solicitudes.Api
      Jwt__Audience: SB.Solicitudes.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY en .env.docker}
      Jwt__ExpirationMinutes: 60
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - ./src/backend/SB.Solicitudes.Api/logs:/app/logs
      - government-entities:/app/App_Data
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: src/frontend/sb-solicitudes-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-5080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
  government-entities:
